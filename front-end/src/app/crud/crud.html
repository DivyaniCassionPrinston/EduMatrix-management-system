<div class="container mt-4">
  <h3 class="mb-3">
    <span class="text-uppercase fw-bold">Student</span> Registration
  </h3>

  <div class="card p-3 shadow-sm">
    <form [formGroup]="form" novalidate>
      <div class="mb-3">
        <label class="form-label" for="studentname">Student Name</label>
        <input
          type="text"
          class="form-control"
          id="studentname"
          formControlName="name"
          placeholder="Enter name"
        />
      </div>

      <div class="mb-3">
        <label class="form-label" for="studentaddress">Address</label>
        <input
          type="text"
          class="form-control"
          id="studentaddress"
          formControlName="address"
          placeholder="Enter address"
        />
      </div>

      <div class="mb-3">
        <label class="form-label" for="fee">Fee / Mobile</label>
        <input
          type="text"
          class="form-control"
          id="fee"
          formControlName="fee"
          placeholder="Enter value"
        />
      </div>

      <div class="d-flex gap-2">
        <button
          type="button"
          class="btn btn-primary"
          (click)="saveRecords()"
          [disabled]="form.invalid"
        >
          Save
        </button>

        <button
          type="button"
          class="btn btn-warning"
          (click)="updateRecords()"
          [disabled]="form.invalid || !isEditing()"
        >
          Update
        </button>
      </div>
    </form>
  </div>

  <div class="container mt-4 px-0">
    <h4 class="mb-3">Student Table</h4>

    <table class="table table-bordered align-middle">
      <thead class="table-light">
        <tr>
          <th>Name</th>
          <th>Address</th>
          <th>Fee</th>
          <th>Option</th>
        </tr>
      </thead>

      <tbody>
        @for (student of students(); track student.id) {
          <tr>
            <td>{{ student.name }}</td>
            <td>{{ student.address }}</td>
            <td>{{ student.fee }}</td>
            <td>
              <button
                type="button"
                class="btn btn-success btn-sm me-2"
                (click)="editRecord(student)"
              >
                Edit
              </button>
              <button
                type="button"
                class="btn btn-danger btn-sm"
                (click)="deleteRecord(student.id)"
              >
                Delete
              </button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
